# Proscan — GitLab CI Example
#
# Runs SAST and SCA scans as separate stages.
# Set PROSCAN_URL and PROSCAN_API_TOKEN as CI/CD variables in GitLab.

stages:
  - security

variables:
  SCAN_TIMEOUT: "30"

sast:
  stage: security
  tags:
    - internal
  script:
    - |
      SCAN_ID=$(curl -sf -X POST "${PROSCAN_URL}/api/v2/scans" \
        -H "Authorization: Bearer ${PROSCAN_API_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{"type": "sast", "target": "."}' | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

      echo "Scan started: ${SCAN_ID}"

      while true; do
        STATUS=$(curl -sf "${PROSCAN_URL}/api/v2/scans/${SCAN_ID}" \
          -H "Authorization: Bearer ${PROSCAN_API_TOKEN}" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
        echo "Status: ${STATUS}"
        [ "${STATUS}" = "completed" ] && break
        [ "${STATUS}" = "failed" ] && exit 1
        sleep 10
      done

      RESULTS=$(curl -sf "${PROSCAN_URL}/api/v2/scans/${SCAN_ID}/results" \
        -H "Authorization: Bearer ${PROSCAN_API_TOKEN}")
      echo "${RESULTS}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Critical: {d.get(\"critical\",0)}, High: {d.get(\"high\",0)}, Total: {d.get(\"total\",0)}')"

      CRITICAL=$(echo "${RESULTS}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('critical',0))")
      HIGH=$(echo "${RESULTS}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('high',0))")
      [ "${CRITICAL}" -gt 0 ] || [ "${HIGH}" -gt 0 ] && exit 1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

sca:
  stage: security
  tags:
    - internal
  script:
    - |
      SCAN_ID=$(curl -sf -X POST "${PROSCAN_URL}/api/v2/scans" \
        -H "Authorization: Bearer ${PROSCAN_API_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{"type": "sca", "target": "."}' | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

      echo "Scan started: ${SCAN_ID}"

      while true; do
        STATUS=$(curl -sf "${PROSCAN_URL}/api/v2/scans/${SCAN_ID}" \
          -H "Authorization: Bearer ${PROSCAN_API_TOKEN}" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
        [ "${STATUS}" = "completed" ] && break
        [ "${STATUS}" = "failed" ] && exit 1
        sleep 10
      done

      curl -sf "${PROSCAN_URL}/api/v2/scans/${SCAN_ID}/results" \
        -H "Authorization: Bearer ${PROSCAN_API_TOKEN}" | python3 -m json.tool
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
